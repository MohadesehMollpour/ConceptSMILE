# UNVERIFIED historical repository configuration, not an authoritative paper protocol.
# Canonical settings stated in the current ConceptSMILE manuscript.
# Fields marked null were not fully specified in the supplied materials.
project:
  name: ConceptSMILE
  seed: 42

evaluation:
  datasets: [HRF, APTOS_2019, ODIR_5K, IDRiD]
  images_per_dataset: 10
  total_images: 40
  concepts: [lesion, blood_vessels, optic_disc]

perturbation:
  method: slic
  target_segments: 7
  compactness: null
  sigma: null
  samples_per_image: 50
  unique_vectors: true
  exclude_all_masked: true
  fill_value: 0

embedding:
  model: facebook/dinov2-base
  representation: cls_token

locality:
  distances: [cosine, wasserstein]
  kernel: exponential
  cosine_sigma: null
  wasserstein_sigma: null

surrogate:
  model: xgboost_regressor
  n_estimators: 200
  max_depth: 3
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  reg_lambda: 1.0
  test_size: 0.30
  repeats: 30

models:
  medsam_checkpoint: null
  qwen_checkpoint: null
  qwen_revision: null
  qwen_do_sample: false
  qwen_max_new_tokens: 60

outputs:
  root: outputs

