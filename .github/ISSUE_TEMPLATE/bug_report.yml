name: Bug report
description: Report a reproducible software defect.
title: "[Bug]: "
labels: [bug]

body:
  - type: markdown
    attributes:
      value: Do not include credentials, retinal images, patient metadata, or security-sensitive details.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include commands, configuration name, and non-sensitive synthetic inputs.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
