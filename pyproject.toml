[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "conceptsmile"
version = "0.1.0.dev0"
description = "Reusable components for auditing concept-based explanations with ConceptSMILE"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Mohadeseh Mollapour" },
  { name = "Koorosh Aslansefat" },
  { name = "Zeinab Dehghani" },
  { name = "Bhupesh Kumar Mishra" },
  { name = "Tejal Shah" },
  { name = "Zhibao Mian" },
]
keywords = [
  "concept-based-xai",
  "explainable-ai",
  "responsible-ai",
  "retinal-imaging",
  "reproducibility",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24",
  "Pillow>=10.0",
  "PyYAML>=6.0",
  "scikit-image>=0.22",
  "scikit-learn>=1.3",
  "scipy>=1.11",
  "xgboost>=2.0",
]

[project.optional-dependencies]
models = [
  "accelerate>=1.0",
  "opencv-python-headless",
  "pandas>=2.0",
  "matplotlib",
  "qwen-vl-utils>=0.0.8",
  "torch>=2.1",
  "transformers>=4.49",
]
dev = [
  "build>=1.0",
  "pytest>=8.0",
  "ruff>=0.6",
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
]

[project.urls]
Documentation = "https://github.com/MohadesehMollpour/ConceptSMILE#readme"
Issues = "https://github.com/MohadesehMollpour/ConceptSMILE/issues"
Repository = "https://github.com/MohadesehMollpour/ConceptSMILE"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["notebooks/legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
